services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-qa-app
    container_name: portfolio-qa-app
    restart: unless-stopped
    ports:
      - "4000:10000"
    env_file:
      - .env.docker
    depends_on:
      - db
    volumes:
      - storage_data:/var/www/html/storage
      - cache_data:/var/www/html/bootstrap/cache

  db:
    image: mysql:8.0
    container_name: portfolio-qa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: secret
    ports:
      - "4001:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  storage_data:
  cache_data:
  db_data:

networks:
  default:
    driver: bridge
